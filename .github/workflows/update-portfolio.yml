name: Update GitHub Portfolio

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Discover public repositories
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh auth status
          python portfolio/generate.py

      - name: Commit portfolio updates
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add README.md portfolio/repositories.json

          if git diff --cached --quiet; then
            echo "No portfolio changes detected."
          else
            git commit -m "chore: automatically update portfolio"
            git push
          fi
